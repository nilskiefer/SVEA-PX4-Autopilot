name: Checks

on:
  push:
    branches:
    - 'main'
    paths-ignore:
      - 'docs/**'
  pull_request:
    branches:
      - '**'
    paths-ignore:
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: px4io/px4-dev:v1.16.0-rc1-258-g0369abd556

    strategy:
      fail-fast: false
      matrix:
        check: [
          "check_format",
          "check_newlines",
          "tests",
          "tests_coverage",
          "px4_fmu-v2_default stack_check",
          "validate_module_configs",
          "shellcheck_all",
          "NO_NINJA_BUILD=1 px4_fmu-v5_default",
          "NO_NINJA_BUILD=1 px4_sitl_default",
          "px4_sitl_allyes",
          "module_documentation",
        ]

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Building [${{ matrix.check }}]
        run: |
          cd "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          make ${{ matrix.check }}

      - name: Uploading Coverage to Codecov.io
        if: contains(matrix.check, 'coverage')
        uses: codecov/codecov-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unittests
          file: coverage/lcov.info

  devcontainer_build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Build Devcontainer Image
        run: |
          cd "$GITHUB_WORKSPACE"
          docker build -t svea-devcontainer-ci -f .devcontainer/Dockerfile .devcontainer

      - name: Build NuttX Targets Inside Devcontainer
        run: |
          cd "$GITHUB_WORKSPACE"
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/workspaces/SVEA-PX4-Autopilot \
            -w /workspaces/SVEA-PX4-Autopilot \
            svea-devcontainer-ci \
            /bin/bash -lc "git config --global --add safe.directory /workspaces/SVEA-PX4-Autopilot && make mikroe_clicker4-stm32f7_noboot -j\$(nproc) && make mikroe_clicker4-stm32f7_bootloader -j\$(nproc)"

      - name: Collect Firmware Artifacts
        run: |
          cd "$GITHUB_WORKSPACE"
          mkdir -p artifacts/svea-firmware
          cp build/mikroe_clicker4-stm32f7_noboot/*.{bin,hex,px4,elf} artifacts/svea-firmware/ 2>/dev/null || true
          cp build/mikroe_clicker4-stm32f7_bootloader/*.{bin,hex,px4,elf} artifacts/svea-firmware/ 2>/dev/null || true
          ls -la artifacts/svea-firmware

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: svea-firmware
          path: artifacts/svea-firmware/

  publish_svea_prerelease:
    runs-on: ubuntu-latest
    needs: devcontainer_build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Download Firmware Artifacts
        uses: actions/download-artifact@v4
        with:
          name: svea-firmware
          path: artifacts/svea-firmware

      - name: Publish Rolling SVEA Pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: svea-latest
          target_commitish: main
          name: "SVEA Latest Firmware"
          prerelease: true
          draft: false
          make_latest: false
          body: |
            Rolling pre-release for the latest `main` firmware build.
            Promote this to a full release when ready.
          files: artifacts/svea-firmware/*
