name: SVEA PMB Mikroe Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "boards/mikroe/**"
      - ".github/workflows/svea_pmb_mikroe_build.yml"

permissions:
  contents: write

jobs:
  build_and_prerelease:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build mikroe noboot firmware
        uses: addnab/docker-run-action@v3
        with:
          image: px4io/px4-dev-nuttx-focal:2022-08-12
          options: -v ${{ github.workspace }}:/workspace
          run: |
            cd /workspace
            git config --global --add safe.directory /workspace
            make mikroe_clicker4-stm32f7_noboot -j$(nproc)

      - name: Collect artifacts
        run: |
          mkdir -p artifacts/svea-pmb-mikroe
          cp build/mikroe_clicker4-stm32f7_noboot/*.{bin,hex,px4,elf} artifacts/svea-pmb-mikroe/ 2>/dev/null || true
          ls -la artifacts/svea-pmb-mikroe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: svea-pmb-mikroe-noboot
          path: artifacts/svea-pmb-mikroe/
          if-no-files-found: error

      - name: Publish prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: svea-pmb-mikroe-latest
          name: SVEA PMB Mikroe Build (noboot)
          prerelease: true
          make_latest: false
          files: artifacts/svea-pmb-mikroe/*
