name: SVEA PMB Mikroe Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build_and_prerelease:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Build Devcontainer Image
        run: |
          cd "$GITHUB_WORKSPACE"
          docker build -t svea-devcontainer-ci -f .devcontainer/Dockerfile .devcontainer

      - name: Build mikroe noboot firmware in devcontainer
        run: |
          cd "$GITHUB_WORKSPACE"
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/workspaces/SVEA-PX4-Autopilot \
            -w /workspaces/SVEA-PX4-Autopilot \
            svea-devcontainer-ci \
            /bin/bash -lc "git config --global --add safe.directory '*' && git submodule sync --recursive && git submodule update --init --recursive && make mikroe_clicker4-stm32f7_noboot -j\$(nproc)"

      - name: Collect artifacts
        run: |
          cd "$GITHUB_WORKSPACE"
          mkdir -p artifacts/svea-pmb-mikroe
          mapfile -t fw_files < <(find build/mikroe_clicker4-stm32f7_noboot -maxdepth 1 -type f \( -name '*.bin' -o -name '*.hex' -o -name '*.px4' -o -name '*.elf' \))
          if [ "${#fw_files[@]}" -eq 0 ]; then
            echo "No firmware artifacts were produced"
            exit 1
          fi
          cp "${fw_files[@]}" artifacts/svea-pmb-mikroe/
          ls -la artifacts/svea-pmb-mikroe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: svea-pmb-mikroe-noboot
          path: artifacts/svea-pmb-mikroe/
          if-no-files-found: error

      - name: Prepare release metadata
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::7}"
          commit_subject="$(git log -1 --pretty=%s)"
          commit_body="$(git log -1 --pretty=%b)"

          echo "RELEASE_NAME=SVEA PMB Mikroe Build (noboot) - ${short_sha}" >> "$GITHUB_ENV"

          {
            echo "Latest successful Mikroe noboot build for \`$GITHUB_REF_NAME\`."
            echo
            echo "- Commit: \`$short_sha\` - $commit_subject"
            echo "- Workflow run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- Trigger: \`$GITHUB_EVENT_NAME\`"
            echo
            if [ -n "$commit_body" ]; then
              echo "### Commit details"
              echo
              echo "$commit_body"
              echo
            fi
            echo "Assets below are replaced on each successful run."
          } > release-notes.md

      - name: Publish prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: svea-pmb-mikroe-latest
          name: ${{ env.RELEASE_NAME }}
          body_path: release-notes.md
          prerelease: true
          make_latest: false
          files: artifacts/svea-pmb-mikroe/*
