name: SVEA Docs - GitHub Pages

on:
  workflow_dispatch:
  release:
    types: [published, edited, unpublished, deleted]
  workflow_run:
    workflows: ["SVEA PMB Mikroe Build"]
    types: [completed]
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - '.github/workflows/svea_docs_pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: svea-docs-pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ (github.event_name == 'release' || github.event_name == 'workflow_run') && github.event.repository.default_branch || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/en/svea/package-lock.json

      - name: Install docs dependencies
        working-directory: docs/en/svea
        run: npm ci

      - name: Build VitePress docs
        working-directory: docs/en/svea
        env:
          BRANCH_NAME: ${{ github.event.repository.name }}
          CI: true
        run: |
          npm run build
          touch .vitepress/dist/.nojekyll

      - name: Stage Clicker4 firmware
        working-directory: docs/en/svea
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .vitepress/stage-flash-firmware.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/en/svea/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
