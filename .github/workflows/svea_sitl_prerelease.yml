name: SVEA SITL Prerelease

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "src/**"
      - "ROMFS/**"
      - "boards/**"
      - "platforms/**"
      - "Tools/**"
      - ".devcontainer/**"
      - ".github/workflows/svea_sitl_prerelease.yml"

permissions:
  contents: write

env:
  SITL_TARGET: gz_rover_ackermann
  PX4_SYS_AUTOSTART: "51000"

jobs:
  build_and_prerelease:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Validate POSIX airframe exists
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          matches=(ROMFS/px4fmu_common/init.d-posix/airframes/${PX4_SYS_AUTOSTART}_*)
          shopt -u nullglob
          if [ "${#matches[@]}" -eq 0 ]; then
            echo "No POSIX SITL airframe found for PX4_SYS_AUTOSTART=${PX4_SYS_AUTOSTART}"
            exit 1
          fi

      - name: Build Devcontainer Image
        run: |
          cd "$GITHUB_WORKSPACE"
          docker build -t svea-devcontainer-ci -f .devcontainer/Dockerfile .devcontainer

      - name: Build SITL firmware in devcontainer
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/workspaces/SVEA-PX4-Autopilot \
            -w /workspaces/SVEA-PX4-Autopilot \
            svea-devcontainer-ci \
            /bin/bash -lc "git config --global --add safe.directory '*' && make px4_sitl_default -j\$(nproc)"

      - name: Collect SITL runtime bundle
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"

          test -f build/px4_sitl_default/bin/px4
          test -d build/px4_sitl_default/etc

          bundle_root="artifacts/svea-sitl"
          bundle_name="svea-sitl-${GITHUB_SHA::12}"
          bundle_dir="${bundle_root}/${bundle_name}"

          mkdir -p "${bundle_dir}"
          cp build/px4_sitl_default/bin/px4 "${bundle_dir}/"
          cp -R build/px4_sitl_default/etc "${bundle_dir}/"

          cat > "${bundle_dir}/README.txt" <<EOF
          SVEA PX4 SITL runtime bundle

          Commit: ${GITHUB_SHA}
          SITL target hint: ${SITL_TARGET}
          SYS_AUTOSTART hint: ${PX4_SYS_AUTOSTART}

          Typical run command:
          PX4_SYS_AUTOSTART=${PX4_SYS_AUTOSTART} PX4_SIM_MODEL=${SITL_TARGET} ./px4
          EOF

          tarball="${bundle_root}/${bundle_name}.tar.gz"
          (
            cd "${bundle_root}"
            tar -czf "$(basename "${tarball}")" "${bundle_name}"
          )

          sha256sum "${tarball}" > "${tarball}.sha256"

          stable_tarball="${bundle_root}/svea-sitl-runtime.tar.gz"
          cp "${tarball}" "${stable_tarball}"
          sha256sum "${stable_tarball}" > "${stable_tarball}.sha256"
          ls -la "${bundle_root}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: svea-sitl-runtime
          path: artifacts/svea-sitl/*
          if-no-files-found: error

      - name: Resolve release channel
        id: release_channel
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "release_tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "release_name=SVEA PX4 SITL Runtime ${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "make_latest=true" >> "$GITHUB_OUTPUT"
            echo "retag_latest=false" >> "$GITHUB_OUTPUT"
          else
            echo "release_tag=svea-sitl-latest" >> "$GITHUB_OUTPUT"
            echo "release_name=SVEA PX4 SITL Runtime" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
            echo "retag_latest=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Move rolling prerelease tag to this commit
        if: steps.release_channel.outputs.retag_latest == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "${{ steps.release_channel.outputs.release_tag }}" "${GITHUB_SHA}"
          git push --force origin "refs/tags/${{ steps.release_channel.outputs.release_tag }}"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_channel.outputs.release_tag }}
          name: ${{ steps.release_channel.outputs.release_name }}
          prerelease: ${{ steps.release_channel.outputs.is_prerelease }}
          make_latest: ${{ steps.release_channel.outputs.make_latest }}
          files: |
            artifacts/svea-sitl/*.tar.gz
            artifacts/svea-sitl/*.sha256
