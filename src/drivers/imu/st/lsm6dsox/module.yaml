module_name: LSM6DSOX
parameters:
- group: Sensors
  definitions:
    LSM6DSOX_ACC_FS:
      description:
        short: LSM6DSOX accelerometer full-scale range [g]
      type: enum
      default: 16
      reboot_required: true
      values:
        2: 2 g
        4: 4 g
        8: 8 g
        16: 16 g
    LSM6DSOX_ACC_ODR:
      description:
        short: LSM6DSOX accelerometer output data rate [Hz]
      type: enum
      default: 417
      reboot_required: true
      values:
        52: 52 Hz
        104: 104 Hz
        208: 208 Hz
        417: 417 Hz
        833: 833 Hz
    LSM6DSOX_GYR_FS:
      description:
        short: LSM6DSOX gyroscope full-scale range [dps]
      type: enum
      default: 2000
      reboot_required: true
      values:
        125: 125 dps
        250: 250 dps
        500: 500 dps
        1000: 1000 dps
        2000: 2000 dps
    LSM6DSOX_GYR_ODR:
      description:
        short: LSM6DSOX gyroscope output data rate [Hz]
      type: enum
      default: 417
      reboot_required: true
      values:
        52: 52 Hz
        104: 104 Hz
        208: 208 Hz
        417: 417 Hz
        833: 833 Hz
